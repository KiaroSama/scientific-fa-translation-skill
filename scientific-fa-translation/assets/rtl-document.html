<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TITLE</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 1.5rem auto;
      max-width: 46rem;
      padding: 0 1rem 3rem;
      direction: rtl;
      unicode-bidi: isolate;
      font-family: "Vazirmatn", "Tahoma", "Segoe UI", sans-serif;
      line-height: 1.85;
    }
    h1, h2, h3, h4 {
      line-height: 1.45;
    }
    p {
      margin: 0.85em 0;
    }
    .ltr,
    pre,
    pre code,
    code,
    kbd,
    samp,
    math {
      direction: ltr;
      unicode-bidi: isolate;
    }
    pre,
    pre code {
      text-align: left;
    }
    pre {
      overflow-x: auto;
      padding: 0.75rem 1rem;
    }
    code {
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.92em;
    }
    a[dir="ltr"] {
      unicode-bidi: isolate;
    }
    figure {
      margin: 1.5rem 0;
    }
    figure img,
    figure svg {
      display: block;
      max-width: 100%;
      height: auto;
      transform: none;
    }
    figcaption, caption {
      font-size: 0.95em;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid currentColor;
      padding: 0.4rem 0.6rem;
    }
    td.num, th.num {
      direction: ltr;
      unicode-bidi: isolate;
      text-align: left;
    }
    .refs {
      direction: ltr;
      unicode-bidi: isolate;
      text-align: left;
    }
    .refs h2 {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>TITLE</h1>

  <!--
    Isolate every English term, number cluster, formula, URL, and citation:
    <span dir="ltr">Adam (Kingma &amp; Ba, 2015)</span>
    شکل <span dir="ltr">3</span>

    Code listings must keep dir="ltr" on <pre>, never RTL:
    <pre dir="ltr"><code>…</code></pre>

    Figures use the original image files; do not mirror:
    <figure>
      <img src="figures/fig-3.png" alt="…" width="720" height="420">
      <figcaption>شکل <span dir="ltr">3</span>. …</figcaption>
    </figure>
  -->

  <section class="refs">
    <h2>منابع</h2>
    <ol>
      <!-- Original-language bibliography. Do not translate entries. -->
    </ol>
  </section>
</body>
</html>
