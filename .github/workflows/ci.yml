name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck -S warning $(git ls-files '*.sh')

      - name: Byte-compile python
        run: python3 -m py_compile $(git ls-files '*.py')

      - name: PowerShell twins run on 5.1 and 7.x
        run: |
          set -e
          fail=0

          # Every shell script in the skill needs a same-named .ps1 twin.
          for sh in scientific-fa-translation-skill/scripts/*.sh; do
            ps1="${sh%.sh}.ps1"
            if [ ! -f "$ps1" ]; then
              echo "missing PowerShell twin for $sh"
              fail=1
            fi
          done

          for f in $(git ls-files '*.ps1'); do
            # 5.1 decodes a BOM-less .ps1 with the system ANSI code page. A
            # UTF-8 em dash then becomes U+201D, which the tokenizer treats
            # as a double quote, and the whole file fails to parse. Staying
            # ASCII removes the dependency on encoding entirely.
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "$f: non-ASCII byte; PowerShell 5.1 will mis-decode it"
              fail=1
            fi
            # PowerShell-7-only syntax breaks 5.1 outright.
            if grep -nE '\?\?|ForEach-Object[[:space:]]+-Parallel|Join-String|\$IsCoreCLR' "$f"; then
              echo "$f: PowerShell 7-only syntax; the twins must also run on 5.1"
              fail=1
            fi
            if ! grep -q '^#Requires -Version 5\.1' "$f"; then
              echo "$f: missing '#Requires -Version 5.1'"
              fail=1
            fi
            # 7.4+ defaults $PSNativeCommandUseErrorActionPreference to true,
            # so a non-zero exit code throws. Any file that probes a native
            # command for its exit code must opt out.
            if grep -q '\$LASTEXITCODE' "$f" &&
               ! grep -q 'PSNativeCommandUseErrorActionPreference = \$false' "$f"; then
              echo "$f: reads \$LASTEXITCODE without opting out of"
              echo "  \$PSNativeCommandUseErrorActionPreference (throws on 7.4+)"
              fail=1
            fi
          done
          exit $fail

      - name: Checker regression tests
        run: bash tests/run.sh

      - name: Skill loads in Claude Code, Cursor, and Codex
        env:
          SKILL_DIR: scientific-fa-translation-skill
        run: |
          set -e
          # All three tools read <skills-dir>/<name>/SKILL.md, one level deep.
          test -f "$SKILL_DIR/SKILL.md"
          grep -q "^name: $SKILL_DIR\$" "$SKILL_DIR/SKILL.md"
          if [ -f SKILL.md ]; then
            echo "SKILL.md at the repo root would ship tests/ and CI as skill"
            echo "content; keep the payload in $SKILL_DIR/"
            exit 1
          fi
          # Each host tool needs its own repo-level guidance entry point.
          for route in AGENTS.md CLAUDE.md \
                       .cursor/rules/scientific-fa-translation.mdc; do
            if [ ! -f "$route" ]; then
              echo "missing guidance file: $route"
              exit 1
            fi
          done
          # check-fa.py resolves ../references/term-pairs.tsv from scripts/.
          test -f "$SKILL_DIR/scripts/check-fa.py"
          test -f "$SKILL_DIR/references/term-pairs.tsv"
          # Prose paths must stay portable across Linux/macOS/WSL/Git Bash.
          if git grep -nI -- '/home/\$USER' -- '*.md' '*.mdc'; then
            echo "use \$HOME/... in prose, not /home/\$USER/..."
            exit 1
          fi
          missing=0
          for ref in $(grep -oE '(references|scripts|assets)/[A-Za-z0-9._-]+' \
                       "$SKILL_DIR/SKILL.md" | sort -u); do
            if [ ! -e "$SKILL_DIR/$ref" ]; then
              echo "SKILL.md references a missing path: $ref"
              missing=1
            fi
          done
          exit $missing

      - name: Packaged .skill matches the skill directory
        env:
          SKILL_DIR: scientific-fa-translation-skill
        run: |
          set -e
          test -f "$SKILL_DIR.skill"
          rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
          unzip -q "$SKILL_DIR.skill" -d /tmp/unpacked
          if ! diff -r "$SKILL_DIR" "/tmp/unpacked/$SKILL_DIR" \
               -x '__pycache__' -x '*.pyc' -x '.DS_Store'; then
            echo "the committed .skill is stale; repackage with:"
            echo "  zip -r $SKILL_DIR.skill $SKILL_DIR \\"
            echo "    -x '*.DS_Store' -x '*__pycache__*'"
            exit 1
          fi
